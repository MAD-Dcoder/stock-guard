services:
  postgres:
    image: postgres:16-alpine
    container_name: stockguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stockguard_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockguard} -d ${POSTGRES_DB:-stockguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
